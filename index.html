const db = firebase.firestore();
const addD    = (col, data)     => db.collection(col).add(data);

// ── GAS Mail API ──────────────────────────────────────────
// GASデプロイ後にURLをここに貼り付け
let GAS_URL = "";

const sendMailViaGAS = async (action, reservation, recipients) => {
  if (!GAS_URL) return; // URL未設定なら無視
  try {
    await fetch(GAS_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action, reservation, recipients })
    });
  } catch(e) { console.warn("メール送信エラー:", e); }
};

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── palette ──────────────────────────────────────────────
const P = {
  bg:       '#eef1f7',
  panel:    '#ffffff',
  border:   '#d8dfe8',
  text:     '#2c3a50',
  muted:    '#6b7a8d',
  dim:      '#9aaabb',
  accent:   '#5b7fa6',
  accentL:  '#7a9ec0',
  green:    '#5a9e8a',
  orange:   '#d4845a',
  danger:   '#b05070',
  ok:       '#4e8f78',
  header:   '#3d5a7a',
};

const ROOM_COLORS = [
  { bg:'#7a9ec044', border:'#5b7fa6', text:'#3d5a7a' },
  { bg:'#7ab89444', border:'#4e8f78', text:'#2d6052' },
  { bg:'#d4845a44', border:'#c06a3a', text:'#7a3a1a' },
  { bg:'#9b7ac844', border:'#7a5aaa', text:'#4a2a7a' },
  { bg:'#c8a03044', border:'#a07a10', text:'#6a4a00' },
  { bg:'#c86a7a44', border:'#a04060', text:'#6a1030' },
];
const getRoomColor = (rooms, room) => ROOM_COLORS[Math.max(0, rooms.indexOf(room)) % ROOM_COLORS.length];

// ── utils ─────────────────────────────────────────────────
const pad  = n => String(n).padStart(2, '0');
const toDS = (y, m, d) => `${y}-${pad(m+1)}-${pad(d)}`;
const dsAdd = (ds, days) => { const d = new Date(ds); d.setDate(d.getDate() + days); return d.toISOString().slice(0,10); };
const getDIM = (y, m) => new Date(y, m+1, 0).getDate();
const getFD  = (y, m) => new Date(y, m, 1).getDay();
const fmtD   = s => { if(!s) return ''; const [y,m,d] = s.split('-'); return `${y}年${+m}月${+d}日`; };
const fmtShort = s => { if(!s) return ''; const [,m,d] = s.split('-'); return `${+m}/${+d}`; };
const hashPw = s => s ? s.split('').reduce((a,c) => ((a<<5)-a+c.charCodeAt(0))|0, 0).toString(36) : '';
const WD = ['日','月','火','水','木','金','土'];
const today = () => { const d = new Date(); return toDS(d.getFullYear(), d.getMonth(), d.getDate()); };

const timeToMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const minToTime = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;
const HOURS = Array.from({length:24}, (_,i) => i);
const TIMES = Array.from({length:48}, (_,i) => `${pad(Math.floor(i/2))}:${i%2===0?'00':'30'}`);

const exportCSV = reservations => {
  const hdr = ['ID','会議室','申請者名','連絡先','用途','人数','開始日','終了日','開始時間','終了時間','申請日時','ステータス'];
  const rows = reservations.map(r => [r.id,r.room,r.name,r.contact,r.purpose,r.people,r.startDate,r.endDate,r.startTime,r.endTime,r.createdAt,r.status]);
  const csv = [hdr,...rows].map(row => row.map(v => `"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'}));
  a.download = `会議室申請履歴_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
};

// ── design tokens ─────────────────────────────────────────
const IS = { width:'100%', background:'#f5f7fc', border:`1.5px solid ${P.border}`, borderRadius:'8px', padding:'9px 11px', color:P.text, fontSize:'16px', outline:'none', boxSizing:'border-box', fontFamily:'inherit' };
const sColor = s => s==='取消' ? P.danger : s==='確認済' ? P.ok : P.accentL;

// ── primitives ────────────────────────────────────────────
const Modal = ({title, onClose, children, width='520px'}) => {
  // Lock background scroll while modal is open
  useEffect(() => {
    document.body.classList.add('modal-open');
    return () => document.body.classList.remove('modal-open');
  }, []);
  return (
    <div onClick={e=>e.target===e.currentTarget&&onClose()}
      onTouchMove={e=>{ if(e.target===e.currentTarget) e.preventDefault(); }}
      style={{position:'fixed',inset:0,background:'rgba(44,58,80,0.5)',backdropFilter:'blur(4px)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:2000,padding:'16px'}}>
      <div style={{background:P.panel,border:`1px solid ${P.border}`,borderRadius:'16px',width:'100%',maxWidth:width,maxHeight:'90vh',overflowY:'auto',WebkitOverflowScrolling:'touch',boxShadow:'0 20px 60px rgba(44,58,80,0.2)',overscrollBehavior:'contain'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'16px 22px',borderBottom:`1px solid ${P.border}`,position:'sticky',top:0,background:P.panel,zIndex:1}}>
          <h2 style={{margin:0,fontSize:'15px',fontWeight:700,color:P.text}}>{title}</h2>
          <button onClick={onClose} style={{background:'none',border:'none',color:P.muted,fontSize:'20px',cursor:'pointer',lineHeight:1,padding:'2px 6px'}}>×</button>
        </div>
        <div style={{padding:'22px'}}>{children}</div>
      </div>
    </div>
  );
};

const Lbl = ({children}) => <label style={{display:'block',fontSize:'11px',color:P.muted,letterSpacing:'0.08em',marginBottom:'5px',textTransform:'uppercase'}}>{children}</label>;
const FI  = ({label, error, ...p}) => (
  <div style={{marginBottom:'13px'}}>
    <Lbl>{label}{error && <span style={{color:P.danger,marginLeft:'6px',fontSize:'10px',textTransform:'none'}}>{error}</span>}</Lbl>
    <input {...p} style={{...IS,...p.style}} onFocus={e=>e.target.style.borderColor=P.accent} onBlur={e=>e.target.style.borderColor=P.border}/>
  </div>
);
const FS = ({label, children, ...p}) => (
  <div style={{marginBottom:'13px'}}>
    <Lbl>{label}</Lbl>
    <select {...p} style={{...IS,appearance:'none',...p.style}}>{children}</select>
  </div>
);
const Btn = ({children, variant='primary', size='md', ...p}) => {
  const bv = {
    primary: {background:`linear-gradient(135deg,${P.accent},#4a6a8e)`,color:'#fff',border:'none'},
    danger:  {background:'transparent',color:P.danger,border:`1px solid ${P.danger}`},
    ghost:   {background:'transparent',color:P.muted,border:`1px solid ${P.border}`},
    soft:    {background:'#eef1f7',color:P.accent,border:`1px solid ${P.border}`},
  };
  const sz = {sm:{padding:'5px 13px',fontSize:'12px'}, md:{padding:'8px 16px',fontSize:'13px'}};
  return <button {...p} style={{...sz[size],...bv[variant],borderRadius:'8px',fontWeight:600,cursor:p.disabled?'not-allowed':'pointer',opacity:p.disabled?0.5:1,letterSpacing:'0.04em',fontFamily:'inherit',transition:'opacity 0.15s',...p.style}} onMouseOver={e=>!p.disabled&&(e.currentTarget.style.opacity='0.85')} onMouseOut={e=>!p.disabled&&(e.currentTarget.style.opacity='1')}>{children}</button>;
};

const Spinner = () => (
  <div style={{display:'flex',flexDirection:'column',alignItems:'center',padding:'64px',gap:'14px'}}>
    <div style={{width:'34px',height:'34px',border:'3px solid #dde3ed',borderTop:`3px solid ${P.accent}`,borderRadius:'50%',animation:'spin 0.8s linear infinite'}}/>
    <span style={{color:P.dim,fontSize:'13px'}}>Firebaseに接続中…</span>
  </div>
);

// ── Password dialog ───────────────────────────────────────
const PwDialog = ({storedHash, onConfirm, onCancel}) => {
  const [pw, setPw] = useState(''), [err, setErr] = useState('');
  const confirm = () => {
    if (!storedHash) { onConfirm(); return; }
    if (hashPw(pw) === storedHash) onConfirm(); else setErr('パスワードが違います');
  };
  return (
    <Modal title="パスワード確認" onClose={onCancel}>
      <p style={{color:P.muted,fontSize:'13px',marginTop:0}}>この申請を変更・取り消しするにはパスワードを入力してください。</p>
      <FI label="4桁パスワード" type="password" maxLength={4} value={pw} onChange={e=>{setPw(e.target.value);setErr('');}} placeholder="****"/>
      {err && <p style={{color:P.danger,fontSize:'12px',marginTop:'-6px'}}>{err}</p>}
      <div style={{display:'flex',gap:'8px',justifyContent:'flex-end'}}>
        <Btn variant="ghost" onClick={onCancel}>キャンセル</Btn>
        <Btn onClick={confirm}>確認</Btn>
      </div>
    </Modal>
  );
};

// ── Reservation form ──────────────────────────────────────
const ResForm = ({rooms, onSubmit, onClose, initial=null, loading, prefill=null}) => {
  const [f, setF] = useState({
    room:      initial?.room      || rooms[0] || '',
    name:      initial?.name      || '',
    contact:   initial?.contact   || '',
    purpose:   initial?.purpose   || '',
    people:    initial?.people    || '',
    startDate: initial?.startDate || prefill?.date || '',
    endDate:   initial?.endDate   || prefill?.date || '',
    startTime: initial?.startTime || prefill?.startTime || '09:00',
    endTime:   initial?.endTime   || prefill?.endTime   || '10:00',
    password:  '',
  });
  const [err, setErr] = useState({});
  const set = (k,v) => setF(x => ({...x, [k]:v}));
  const validate = () => {
    const e = {};
    if (!f.room) e.room = '必須';
    if (!f.name.trim()) e.name = '必須';
    if (!f.contact.trim()) e.contact = '必須';
    if (!f.purpose.trim()) e.purpose = '必須';
    if (!f.people || isNaN(f.people) || Number(f.people)<1) e.people = '1以上';
    if (!f.startDate) e.startDate = '必須';
    if (!f.endDate) e.endDate = '必須';
    if (f.startDate && f.endDate && f.startDate > f.endDate) e.endDate = '終了日が開始日より前';
    if (!initial && (!f.password || f.password.length !== 4 || isNaN(f.password))) e.password = '4桁の数字';
    return e;
  };
  const submit = () => {
    const e = validate();
    if (Object.keys(e).length) { setErr(e); return; }
    onSubmit({...f, people:Number(f.people), passwordHash: initial ? initial.passwordHash : hashPw(f.password)});
  };
  return (
    <Modal title={initial ? '申請を編集' : '会議室申請'} onClose={onClose}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 13px'}}>
        <div style={{gridColumn:'1/-1'}}><FS label="会議室" value={f.room} onChange={e=>set('room',e.target.value)}>{rooms.map(r=><option key={r}>{r}</option>)}</FS></div>
        <FI label="申請者名" error={err.name} value={f.name} onChange={e=>set('name',e.target.value)} placeholder="山田 太郎"/>
        <FI label="連絡先" error={err.contact} value={f.contact} onChange={e=>set('contact',e.target.value)} placeholder="090-xxxx-xxxx"/>
        <div style={{gridColumn:'1/-1'}}><FI label="用途" error={err.purpose} value={f.purpose} onChange={e=>set('purpose',e.target.value)} placeholder="全体会議、研修など"/></div>
        <FI label="人数" error={err.people} type="number" min="1" value={f.people} onChange={e=>set('people',e.target.value)}/>
        <div/>
        <FI label="開始日" error={err.startDate} type="date" value={f.startDate} onChange={e=>set('startDate',e.target.value)}/>
        <FI label="終了日" error={err.endDate} type="date" value={f.endDate} onChange={e=>set('endDate',e.target.value)}/>
        <FS label="開始時間" value={f.startTime} onChange={e=>set('startTime',e.target.value)}>{TIMES.map(t=><option key={t}>{t}</option>)}</FS>
        <FS label="終了時間" value={f.endTime} onChange={e=>set('endTime',e.target.value)}>{TIMES.map(t=><option key={t}>{t}</option>)}</FS>
        {!initial && (
          <div style={{gridColumn:'1/-1'}}>
            <FI label="パスワード（4桁数字）" error={err.password} type="password" maxLength={4} value={f.password} onChange={e=>set('password',e.target.value)} placeholder="修正・取消時に使用"/>
            <p style={{fontSize:'11px',color:P.dim,marginTop:'-5px',marginBottom:0}}>※後から修正・取り消しするときに使います</p>
          </div>
        )}
      </div>
      <div style={{display:'flex',gap:'8px',justifyContent:'flex-end',marginTop:'10px'}}>
        <Btn variant="ghost" onClick={onClose}>キャンセル</Btn>
        <Btn onClick={submit} disabled={loading}>{loading ? '保存中…' : initial ? '保存' : '申請する'}</Btn>
      </div>
    </Modal>
  );
};

// ── Day View (Google-Calendar-like UX) ─────────────────────
const CELL_H = 64;
const DAY_HOURS = 24;
const LONGPRESS_MS = 300;   // hold this long to start selecting a time range
const SWIPE_THRESH = 60;    // px horizontal swipe to change day

const DayView = ({dateStr, reservations, rooms, onNavigate, onSlotClick, onResClick}) => {
  const active = reservations.filter(r => r.status !== '取消' && r.startDate <= dateStr && r.endDate >= dateStr);
  const scrollRef = useRef(null);
  const gridRef   = useRef(null);
  const [dragVis, setDragVis] = useState(null);
  const [selecting, setSelecting] = useState(false);
  const [swipeX, setSwipeX] = useState(0);          // live horizontal offset feedback

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = 8 * CELL_H;
  }, [dateStr]);

  const yToMin = (clientY) => {
    if (!gridRef.current || !scrollRef.current) return 0;
    const rect = gridRef.current.getBoundingClientRect();
    const relY = clientY - rect.top + scrollRef.current.scrollTop;
    return Math.max(0, Math.min(23*60+30, Math.round((relY/CELL_H)*60/30)*30));
  };

  // ── Touch logic: tap=1h | long-press(then drag)=range | h-swipe=day | v=scroll ──
  useEffect(() => {
    const grid = gridRef.current;
    if (!grid) return;

    let sx=0, sy=0, t0=0;
    let mode = null;        // null | 'select' | 'swipe' | 'scroll'
    let lpFired = false;    // long-press timer fired
    let lpTimer = null;
    let selStart = 0;
    let tapped = false;

    const LP_MOVE_TOL = 14;   // allow this much finger wobble before long-press fires
    const DIR_TOL = 12;       // movement to decide swipe vs scroll

    const clearLP = () => { if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; } };

    const onStart = (e) => {
      if (e.target.closest('[data-res]')) { tapped = false; return; }
      tapped = true;
      lpFired = false;
      const t = e.touches[0];
      sx = t.clientX; sy = t.clientY; t0 = Date.now();
      mode = null;
      selStart = yToMin(t.clientY);
      lpTimer = setTimeout(() => {
        // long-press confirmed → enter selection mode
        lpFired = true;
        mode = 'select';
        setSelecting(true);
        setDragVis({ startMin: selStart, endMin: selStart + 60 });
        if (navigator.vibrate) navigator.vibrate(20);
      }, LONGPRESS_MS);
    };

    const onMove = (e) => {
      if (!tapped) return;
      const t = e.touches[0];
      const dx = t.clientX - sx;
      const dy = t.clientY - sy;

      // Before long-press fires: small wobble is OK (keep waiting),
      // but a clear directional move cancels long-press and picks swipe/scroll.
      if (!lpFired && mode === null) {
        if (Math.abs(dx) > DIR_TOL && Math.abs(dx) > Math.abs(dy)) {
          clearLP(); mode = 'swipe';
        } else if (Math.abs(dy) > LP_MOVE_TOL) {
          clearLP(); mode = 'scroll';
        }
        // else: within tolerance → do nothing, let long-press timer run
        if (mode === null) return;
      }

      if (mode === 'swipe') {
        e.preventDefault();
        setSwipeX(dx);
      } else if (mode === 'select') {
        e.preventDefault();
        const min = yToMin(t.clientY);
        setDragVis({ startMin: Math.min(selStart, min), endMin: Math.max(selStart + 30, min + 30) });
      }
      // mode === 'scroll' → browser scrolls
    };

    const onEnd = (e) => {
      clearLP();
      if (!tapped) return;
      tapped = false;
      const ct = e.changedTouches[0];
      const dyTotal = Math.abs(ct.clientY - sy);
      const dxTotal = Math.abs(ct.clientX - sx);
      const dt = Date.now() - t0;

      if (mode === 'swipe') {
        setSwipeX(0);
        const dx = ct.clientX - sx;
        if (Math.abs(dx) > SWIPE_THRESH) onNavigate(dx < 0 ? 1 : -1);
      } else if (mode === 'select' || lpFired) {
        const cur = dragVisRef.current;
        setSelecting(false); setDragVis(null);
        if (cur) onSlotClick({date:dateStr, startTime:minToTime(cur.startMin), endTime:minToTime(Math.min(cur.endMin,24*60))});
      } else if (mode === null && dyTotal < 12 && dxTotal < 12 && dt < LONGPRESS_MS) {
        // quick tap → 1h slot
        const min = yToMin(sy);
        onSlotClick({date:dateStr, startTime:minToTime(min), endTime:minToTime(Math.min(min+60,24*60))});
      }
      mode = null; lpFired = false;
    };

    const onCancel = () => { clearLP(); tapped=false; mode=null; lpFired=false; setSelecting(false); setDragVis(null); setSwipeX(0); };

    grid.addEventListener('touchstart', onStart, {passive:true});
    grid.addEventListener('touchmove',  onMove,  {passive:false});
    grid.addEventListener('touchend',   onEnd,   {passive:true});
    grid.addEventListener('touchcancel',onCancel,{passive:true});
    return () => {
      grid.removeEventListener('touchstart', onStart);
      grid.removeEventListener('touchmove',  onMove);
      grid.removeEventListener('touchend',   onEnd);
      grid.removeEventListener('touchcancel',onCancel);
    };
  }, [dateStr, onSlotClick, onNavigate]);

  // keep latest dragVis in a ref for touchend closure
  const dragVisRef = useRef(null);
  useEffect(() => { dragVisRef.current = dragVis; }, [dragVis]);

  // ── Mouse (desktop): drag to select ───────────────────────
  const mouseRef = useRef(null);
  const handleMouseDown = (e) => {
    if (e.button !== 0 || e.target.closest('[data-res]')) return;
    e.preventDefault();
    const min = yToMin(e.clientY);
    mouseRef.current = { startMin: min, endMin: min + 60 };
    setDragVis({...mouseRef.current});
  };
  const handleMouseMove = (e) => {
    if (!mouseRef.current) return;
    const min = yToMin(e.clientY);
    const next = { startMin: mouseRef.current.startMin, endMin: Math.max(mouseRef.current.startMin+30, min+30) };
    mouseRef.current = next;
    setDragVis({...next});
  };
  const handleMouseUp = () => {
    if (!mouseRef.current) return;
    const {startMin, endMin} = mouseRef.current;
    mouseRef.current = null;
    setDragVis(null);
    onSlotClick({date:dateStr, startTime:minToTime(startMin), endTime:minToTime(Math.min(endMin,24*60))});
  };

// ── Week View ─────────────────────────────────────────────
const WeekView = ({startDate, reservations, rooms, onNavigate, onSlotClick, onResClick}) => {
  const scrollRef = useRef(null);
  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = 8 * CELL_H; }, [startDate]);

  const days = Array.from({length:7}, (_,i) => dsAdd(startDate, i));
  const todayStr = today();

  const getActive = ds => reservations.filter(r => r.status !== '取消' && r.startDate <= ds && r.endDate >= ds);

  const [,sm,] = startDate.split('-');
  const [,em,] = days[6].split('-');
  const label = sm === em
    ? `${startDate.split('-')[0]}年${+sm}月`
    : `${startDate.split('-')[0]}年${+sm}月〜${+em}月`;

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      <div style={{display:'flex',alignItems:'center',gap:'10px',padding:'10px 14px',borderBottom:`1px solid ${P.border}`,background:P.panel,flexShrink:0}}>
        <button onClick={()=>onNavigate(-7)} style={{background:'#eef1f7',border:'none',borderRadius:'6px',padding:'5px 12px',cursor:'pointer',fontSize:'16px',color:P.muted}}>‹</button>
        <span style={{flex:1,textAlign:'center',fontWeight:700,fontSize:'15px',color:P.text}}>{label}</span>
        <button onClick={()=>onNavigate(7)} style={{background:'#eef1f7',border:'none',borderRadius:'6px',padding:'5px 12px',cursor:'pointer',fontSize:'16px',color:P.muted}}>›</button>
      </div>

      {/* day headers */}
      <div style={{display:'grid',gridTemplateColumns:'52px repeat(7,1fr)',background:P.panel,borderBottom:`1px solid ${P.border}`,flexShrink:0}}>
        <div/>
        {days.map((ds,i) => {
          const [y,m,d] = ds.split('-').map(Number);
          const isToday = ds === todayStr;
          const dow = (new Date(y,m-1,d)).getDay();
          return (
            <div key={ds} style={{textAlign:'center',padding:'8px 4px',borderLeft:`1px solid ${P.border}`}}>
              <div style={{fontSize:'11px',color:dow===0?P.danger:dow===6?P.accentL:P.muted}}>{WD[dow]}</div>
              <div style={{fontSize:'16px',fontWeight:700,color:isToday?'#fff':dow===0?P.danger:dow===6?P.accentL:P.text,background:isToday?P.accent:'none',borderRadius:'50%',width:'30px',height:'30px',display:'flex',alignItems:'center',justifyContent:'center',margin:'2px auto'}}>{d}</div>
            </div>
          );
        })}
      </div>

      <div ref={scrollRef} style={{overflowY:'auto',flex:1}}>
        <div style={{display:'grid',gridTemplateColumns:'52px repeat(7,1fr)',height:`${DAY_HOURS*CELL_H}px`,position:'relative'}}>
          {/* hour labels */}
          <div>
            {HOURS.map(h => (
              <div key={h} style={{height:`${CELL_H}px`,display:'flex',alignItems:'flex-start',justifyContent:'flex-end',paddingRight:'6px',paddingTop:'2px'}}>
                <span style={{fontSize:'10px',color:P.dim}}>{pad(h)}:00</span>
              </div>
            ))}
          </div>
          {/* columns */}
          {days.map((ds,ci) => (
            <div key={ds} style={{borderLeft:`1px solid ${P.border}`,position:'relative',cursor:'pointer'}}
              onClick={e=>{
                if (e.target.closest('[data-res]')) return;
                const rect = e.currentTarget.getBoundingClientRect();
                const relY = e.clientY - rect.top + scrollRef.current.scrollTop;
                const min = Math.round((relY / CELL_H) * 60 / 30) * 30;
                onSlotClick({date:ds, startTime:minToTime(min), endTime:minToTime(Math.min(min+60,24*60))});
              }}>
              {HOURS.map(h => <div key={h} style={{height:`${CELL_H}px`,borderBottom:`1px solid ${P.border}88`}}/>)}
              {getActive(ds).map(r => {
                const sm2 = timeToMin(r.startTime), em2 = timeToMin(r.endTime);
                const rc = getRoomColor(rooms, r.room);
                return (
                  <div key={r.id} data-res="1" onClick={e=>{e.stopPropagation();onResClick(r);}}
                    style={{position:'absolute',left:'2px',right:'2px',top:`${(sm2/60)*CELL_H}px`,height:`${(Math.max(em2-sm2,30)/60)*CELL_H}px`,background:rc.bg,borderLeft:`3px solid ${rc.border}`,borderRadius:'4px',padding:'2px 5px',cursor:'pointer',overflow:'hidden',zIndex:10,boxShadow:'0 1px 3px rgba(44,58,80,0.1)'}}>
                    <div style={{fontSize:'10px',fontWeight:700,color:rc.text,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{r.room}</div>

                );
              })}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

// ── Month View ────────────────────────────────────────────
const MonthView = ({year, month, reservations, rooms, onNavigate, onDayClick}) => {
  const days = getDIM(year, month);

  const todayStr = today();
  const active = reservations.filter(r => r.status !== '取消');

    const ds = toDS(year, month, d);
    return active.filter(r => r.startDate <= ds && r.endDate >= ds);
  };

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      <div style={{display:'flex',alignItems:'center',gap:'10px',padding:'10px 14px',borderBottom:`1px solid ${P.border}`,background:P.panel,flexShrink:0}}>

        <span style={{flex:1,textAlign:'center',fontWeight:700,fontSize:'15px',color:P.text}}>{year}年 {month+1}月</span>
        <button onClick={()=>onNavigate(1)} style={{background:'#eef1f7',border:'none',borderRadius:'6px',padding:'5px 12px',cursor:'pointer',fontSize:'16px',color:P.muted}}>›</button>
      </div>

      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',flex:1,overflow:'auto'}}>
        {Array(first).fill(null).map((_,i) => <div key={'e'+i} style={{borderRight:`1px solid ${P.border}`,borderBottom:`1px solid ${P.border}`}}/>)}
        {Array(days).fill(null).map((_,i) => {
          const d = i+1, ds = toDS(year, month, d);
          const dr = getResForDay(d);
          const isToday = ds === todayStr;
          const dow = (first+i) % 7;
          return (
            <div key={d} onClick={() => onDayClick(ds)} style={{borderRight:`1px solid ${P.border}`,borderBottom:`1px solid ${P.border}`,minHeight:'80px',padding:'5px',cursor:'pointer',background:isToday?P.accent+'11':'#fff',transition:'background 0.1s'}}
              onMouseOver={e=>e.currentTarget.style.background=isToday?P.accent+'22':'#f4f7ff'}
              onMouseOut={e=>e.currentTarget.style.background=isToday?P.accent+'11':'#fff'}>
              <span style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:'24px',height:'24px',fontSize:'13px',fontWeight:isToday?700:400,color:isToday?'#fff':dow===0?P.danger:dow===6?P.accentL:P.text,background:isToday?P.accent:'none',borderRadius:'50%'}}>{d}</span>
              <div style={{marginTop:'2px',display:'flex',flexDirection:'column',gap:'2px'}}>
                {dr.slice(0,3).map(r => {
                  const rc = getRoomColor(rooms, r.room);
                  return <div key={r.id} style={{fontSize:'10px',background:rc.bg,color:rc.text,borderLeft:`2px solid ${rc.border}`,padding:'1px 4px',borderRadius:'2px',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{r.room}</div>;

                {dr.length>3 && <div style={{fontSize:'9px',color:P.dim}}>+{dr.length-3}件</div>}

      <div style={{display:'flex',gap:'4px',marginBottom:'18px',background:'#eef1f7',borderRadius:'8px',padding:'3px',flexWrap:'wrap'}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,minWidth:'70px',padding:'7px 4px',borderRadius:'6px',border:'none',fontFamily:'inherit',fontSize:'12px',fontWeight:700,cursor:'pointer',background:tab===t.id?'#fff':'transparent',color:tab===t.id?P.accent:P.muted,boxShadow:tab===t.id?'0 1px 4px rgba(44,58,80,0.1)':'none'}}>{t.label}</button>
        ))}
      </div>

      {/* ── Mail ── */}
      {tab==='mail' && (
        <div>
          <div style={{marginBottom:'18px'}}>
            <Lbl>GAS Web App URL（メール送信用）</Lbl>
            <input value={gasUrl} onChange={e=>setGasUrl(e.target.value)}
              placeholder="https://script.google.com/macros/s/.../exec"
              style={{...IS,fontSize:'12px'}}
              onFocus={e=>e.target.style.borderColor=P.accent} onBlur={e=>e.target.style.borderColor=P.border}/>
            <p style={{fontSize:'11px',color:P.dim,margin:'4px 0 0'}}>GASをデプロイ後、表示されたURLを貼り付け</p>
          </div>
          <Lbl>メール送信先</Lbl>
          <div style={{fontSize:'11px',color:P.dim,marginBottom:'8px'}}>送信元: f.ryota89@gmail.com</div>
          <div style={{display:'flex',gap:'8px',marginBottom:'10px'}}>
            <input value={newAddr} onChange={e=>setNewAddr(e.target.value)}
              onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();addAddr();}}}
              placeholder="追加するメールアドレス" style={{...IS,flex:1,fontSize:'13px'}}
              onFocus={e=>e.target.style.borderColor=P.accent} onBlur={e=>e.target.style.borderColor=P.border}/>
            <Btn onClick={addAddr}>追加</Btn>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
            {recipients.map(addr=>(
              <div key={addr} style={{display:'flex',alignItems:'center',justifyContent:'space-between',background:'#f5f7fc',border:`1px solid ${P.border}`,borderRadius:'8px',padding:'9px 12px'}}>
                <span style={{fontSize:'13px',color:P.text,wordBreak:'break-all'}}>📧 {addr}</span>
                <button onClick={()=>removeAddr(addr)} style={{background:'none',border:'none',color:P.danger,cursor:'pointer',fontSize:'18px',lineHeight:1,padding:'0 4px',flexShrink:0}}>×</button>
              </div>
            ))}
            {recipients.length===0 && <p style={{color:P.dim,fontSize:'12px',textAlign:'center',padding:'12px'}}>送信先がありません</p>}
          </div>
        </div>
      )}

      {/* ── Rooms ── */}
      {tab==='rooms' && (
        <div>
          <Lbl>会議室の管理</Lbl>
          <div style={{display:'flex',gap:'8px',marginBottom:'14px'}}>
            <input value={newRoom} onChange={e=>setNewRoom(e.target.value)}
              placeholder="会議室名を入力" style={{...IS,flex:1}}
              onFocus={e=>e.target.style.borderColor=P.accent} onBlur={e=>e.target.style.borderColor=P.border}/>
            <Btn onClick={addRoom} disabled={loading}>追加</Btn>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>
            {rooms.map(r=>{
              const rc=getRoomColor(rooms,r);
              return (
                <div key={r} style={{display:'flex',alignItems:'center',justifyContent:'space-between',background:'#f8faff',border:`1px solid ${P.border}`,borderRadius:'10px',padding:'11px 15px'}}>
                  <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
                    <span style={{width:'10px',height:'10px',borderRadius:'50%',background:rc.border,display:'inline-block'}}/>
                    <span style={{color:P.text,fontSize:'14px'}}>{r}</span>
                  </div>
                  <Btn variant="danger" size="sm" onClick={()=>onRemoveRoom(r)} disabled={rooms.length<=1}>削除</Btn>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ── Data / CSV ── */}
      {tab==='data' && (
        <div>
          <Lbl>データ出力</Lbl>
          <p style={{fontSize:'13px',color:P.muted,margin:'0 0 14px'}}>
            すべての申請履歴をCSVファイルでダウンロードします（Excelで開けます）。
          </p>
          <Btn onClick={()=>exportCSV(reservations)}>📥 CSVをダウンロード（{reservations.length}件）</Btn>
        </div>
      )}

      {/* ── Admin password ── */}
      {tab==='admin' && (
        <div>
          <Lbl>管理者パスワード</Lbl>
          <p style={{fontSize:'13px',color:P.muted,margin:'0 0 14px'}}>
            設定すると、この設定画面を開くときにパスワードが必要になります。空欄で保存すると解除されます。
          </p>
          <div style={{display:'flex',gap:'8px'}}>
            <input value={pw1} onChange={e=>setPw1(e.target.value)} type="password"
              placeholder={adminPw?'設定済み（変更する場合のみ入力）':'新しいパスワード'}
              style={{...IS,flex:1}}
              onFocus={e=>e.target.style.borderColor=P.accent} onBlur={e=>e.target.style.borderColor=P.border}/>
            <Btn onClick={()=>{ setAdminPw(pw1); setPw1(''); alert(pw1?'管理者パスワードを設定しました':'管理者パスワードを解除しました'); }}>保存</Btn>
          </div>
        </div>
      )}

      <div style={{display:'flex',justifyContent:'flex-end',marginTop:'22px'}}>
        <Btn variant="ghost" onClick={onClose}>閉じる</Btn>
      </div>
    </Modal>
  );
};

// ── Main App ──────────────────────────────────────────────
function App() {
  const [ready,setReady]       = useState(false);
  const [fireErr,setFireErr]   = useState(null);
  const [reservations,setRes]  = useState([]);
  const [rooms,setRooms]       = useState(['第1会議室','第2会議室','大ホール']);
  const [viewMode,setViewMode] = useState('month'); // 'day' | 'week' | 'month'
  const [busy,setBusy]         = useState(false);

  // date cursors
  const [dayDate,setDayDate]   = useState(today());
  const [weekStart,setWeekStart] = useState(() => { const d=new Date(); d.setDate(d.getDate()-d.getDay()); return d.toISOString().slice(0,10); });
  const [calYear,setCalYear]   = useState(new Date().getFullYear());
  const [calMonth,setCalMonth] = useState(new Date().getMonth());

  // modals
  const [showForm,setShowForm]   = useState(false);
  const [formPrefill,setFormPrefill] = useState(null);
  const [editTarget,setEditTarget] = useState(null);
  const [cancelTarget,setCancelTarget] = useState(null);
  const [pwTarget,setPwTarget]   = useState(null);
  const [pwAction,setPwAction]   = useState(null);
  const [detailRes,setDetailRes] = useState(null);
  const [mailRecipients,setMailRecipients] = useState(['k2216001@maniwa.gse.okayama-c.ed.jp']);
  const [gasUrl,setGasUrl] = useState('');
  const [showSettings,setShowSettings] = useState(false);
  const [adminPw,setAdminPw] = useState('yoyaku');
  const [settingsGate,setSettingsGate] = useState(false); // password prompt before settings

  useEffect(() => {
    let u1,u2;
    try {
      u1 = onSnap('meeting_rooms', docs => { if(docs.length>0) setRooms(docs.map(d=>d.name).filter(Boolean)); });
      u2 = onSnap('meeting_reservations', docs => { setRes(docs); setReady(true); });
    } catch(e) { setFireErr('Firebase接続エラー: '+e.message); setReady(true); }
    return () => { u1&&u1(); u2&&u2(); };
  }, []);

  // GAS URLをグローバル変数に同期
  useEffect(() => { GAS_URL = gasUrl; }, [gasUrl]);

  const addRoom    = async n => { setBusy(true); try{ await addD('meeting_rooms',{name:n}); }catch(e){alert(e.message);} finally{setBusy(false);} };
  const removeRoom = async n => { setBusy(true); try{ const docs=await getDs('meeting_rooms'); const t=docs.find(d=>d.name===n); if(t) await delD('meeting_rooms',t.id); }catch(e){alert(e.message);} finally{setBusy(false);} };
  const addRes     = async form => { setBusy(true); try{ const now=new Date().toISOString(); const saved={...form,status:'申請中',createdAt:now,updatedAt:now}; await addD('meeting_reservations',saved); await sendMailViaGAS('sendReservation',form,mailRecipients); setShowForm(false);setFormPrefill(null); }catch(e){alert(e.message);} finally{setBusy(false);} };
  const updateRes  = async form => { setBusy(true); try{ await updD('meeting_reservations',editTarget.id,{...form,updatedAt:new Date().toISOString()}); await sendMailViaGAS('sendUpdate',form,mailRecipients); setEditTarget(null);setDetailRes(null); }catch(e){alert(e.message);} finally{setBusy(false);} };
  const cancelRes  = async ()  => { setBusy(true); try{ await updD('meeting_reservations',cancelTarget.id,{status:'取消',updatedAt:new Date().toISOString()}); await sendMailViaGAS('sendCancel',cancelTarget,mailRecipients); setCancelTarget(null);setDetailRes(null); }catch(e){alert(e.message);} finally{setBusy(false);} };

  const reqEdit   = r => { setDetailRes(null); setPwTarget(r); setPwAction('edit'); };
  const reqCancel = r => { setDetailRes(null); setPwTarget(r); setPwAction('cancel'); };
  const pwConfirm = () => {
    if(pwAction==='edit') setEditTarget(pwTarget);
    if(pwAction==='cancel') setCancelTarget(pwTarget);
    setPwTarget(null); setPwAction(null);
  };

  const handleSlotClick = ({date, startTime, endTime}) => {
    // 既に予約が入っている時間帯なら新規申請させない
    const sM = parseInt(startTime.slice(0,2))*60 + parseInt(startTime.slice(3,5));
    const eM = parseInt(endTime.slice(0,2))*60 + parseInt(endTime.slice(3,5));
    const conflict = reservations.some(r => {
      if (r.status === '取消') return false;
      if (!(r.startDate <= date && r.endDate >= date)) return false;
      const rs = parseInt(r.startTime.slice(0,2))*60 + parseInt(r.startTime.slice(3,5));
      const re = parseInt(r.endTime.slice(0,2))*60 + parseInt(r.endTime.slice(3,5));
      return sM < re && eM > rs; // 時間が重なる
    });
    if (conflict) {
      alert('その時間帯はすでに予約が入っています。別の時間を選んでください。');
      return;
    }
    setFormPrefill({date, startTime, endTime});
    setShowForm(true);
  };

  const handleDayNav = delta => setDayDate(ds => dsAdd(ds, delta));
  const handleWeekNav = delta => setWeekStart(ds => dsAdd(ds, delta));
  const handleMonthNav = delta => {
    setCalMonth(m => { let nm=m+delta; if(nm<0){setCalYear(y=>y-1);return 11;} if(nm>11){setCalYear(y=>y+1);return 0;} return nm; });
  };

  const handleMonthDayClick = ds => { setDayDate(ds); setViewMode('day'); };
  const handleResClick = r => setDetailRes(r);

  const openSettings = () => {
    if (adminPw) setSettingsGate(true);   // require password
    else setShowSettings(true);
  };

  const TABS = [{id:'calendar',label:'📅 カレンダー'},{id:'history',label:'📋 履歴'}];
  const [mainTab, setMainTab] = useState('calendar');

  const activeCount = reservations.filter(r=>r.status==='申請中').length;

  return (
    <div style={{height:'100vh',background:P.bg,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      {/* Header */}
      <div style={{background:P.header,padding:'0 16px',position:'sticky',top:0,zIndex:100,boxShadow:'0 2px 12px rgba(44,58,80,0.25)'}}>
        {/* Row 1: title + LIVE + settings */}
        <div style={{maxWidth:'1200px',margin:'0 auto',display:'flex',alignItems:'center',gap:'10px',padding:'10px 0'}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:'15px',fontWeight:800,color:'#fff',letterSpacing:'0.03em',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>🏢 会議室予約システム</div>
            <div style={{fontSize:'9px',color:'rgba(255,255,255,0.5)',letterSpacing:'0.1em'}}>MEETING ROOM RESERVATION</div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:'4px'}}>
            <span style={{width:'7px',height:'7px',borderRadius:'50%',background:ready?'#7de8c0':'#aaa',display:'inline-block',animation:'pulse 2s infinite'}}/>
            <span style={{fontSize:'11px',color:ready?'#7de8c0':'#aaa'}}>{ready?'LIVE':'接続中'}</span>
          </div>
          <button onClick={openSettings} style={{background:'rgba(255,255,255,0.12)',border:'1px solid rgba(255,255,255,0.25)',color:'#fff',borderRadius:'8px',padding:'6px 12px',cursor:'pointer',fontFamily:'inherit',fontSize:'13px',fontWeight:600}}>⚙️ 設定</button>
        </div>

        {/* Row 2: view modes + new reservation (always visible) */}
        <div style={{maxWidth:'1200px',margin:'0 auto',display:'flex',alignItems:'center',gap:'8px',paddingBottom:'10px',flexWrap:'wrap'}}>
          <div style={{display:'flex',gap:'4px',background:'rgba(255,255,255,0.12)',borderRadius:'8px',padding:'3px'}}>
            {[{id:'month',label:'月'},{id:'week',label:'週'},{id:'day',label:'日'}].map(v=>(
              <button key={v.id} onClick={()=>{setMainTab('calendar');setViewMode(v.id);}} style={{padding:'5px 16px',borderRadius:'6px',border:'none',fontFamily:'inherit',fontSize:'13px',fontWeight:700,cursor:'pointer',background:(mainTab==='calendar'&&viewMode===v.id)?'#fff':'transparent',color:(mainTab==='calendar'&&viewMode===v.id)?P.header:'rgba(255,255,255,0.78)',transition:'all 0.15s'}}>{v.label}</button>
            ))}
          </div>
          <Btn onClick={()=>{setFormPrefill(null);setShowForm(true);}} style={{background:'#fff',color:P.header}}>＋ 新規申請</Btn>
          {activeCount>0 && <span style={{background:'#e8a87c',color:'#fff',borderRadius:'20px',padding:'4px 12px',fontSize:'12px',fontWeight:700,whiteSpace:'nowrap'}}>申請中 {activeCount}件</span>}
        </div>

        {/* Row 3: main tabs */}
        <div style={{display:'flex',maxWidth:'1200px',margin:'0 auto'}}>
          {TABS.map(t=>(
            <button key={t.id} onClick={()=>setMainTab(t.id)} style={{background:'none',border:'none',color:mainTab===t.id?'#fff':'rgba(255,255,255,0.55)',padding:'9px 16px',cursor:'pointer',fontFamily:'inherit',fontSize:'13px',fontWeight:700,borderBottom:mainTab===t.id?'2px solid #fff':'2px solid transparent',letterSpacing:'0.04em'}}>
              {t.label}
            </button>
          ))}
        </div>
      </div>

      {/* Main */}
      <div style={{flex:1,maxWidth:'1200px',width:'100%',margin:'0 auto',padding:'12px',display:'flex',flexDirection:'column',minHeight:0,overflow:'hidden'}}>
        {!ready ? <Spinner/> : fireErr ? (
          <div style={{background:'#fce8ee',border:`1px solid ${P.danger}`,borderRadius:'12px',padding:'20px',color:P.danger}}>{fireErr}</div>
        ) : (
          <div style={{background:P.panel,borderRadius:'16px',boxShadow:'0 2px 16px rgba(44,58,80,0.08)',border:`1px solid ${P.border}`,overflow:'hidden',flex:1,display:'flex',flexDirection:'column',minHeight:0}}>
            {mainTab==='calendar' && viewMode==='day' && (
              <DayView dateStr={dayDate} reservations={reservations} rooms={rooms}
                onNavigate={d=>handleDayNav(d)} onSlotClick={handleSlotClick} onResClick={handleResClick}/>
            )}
            {mainTab==='calendar' && viewMode==='week' && (
              <WeekView startDate={weekStart} reservations={reservations} rooms={rooms}
                onNavigate={d=>handleWeekNav(d)} onSlotClick={handleSlotClick} onResClick={handleResClick}/>
            )}
            {mainTab==='calendar' && viewMode==='month' && (
              <MonthView year={calYear} month={calMonth} reservations={reservations} rooms={rooms}
                onNavigate={d=>handleMonthNav(d)} onDayClick={handleMonthDayClick}/>
            )}
            {mainTab==='history' && <HistView reservations={reservations} rooms={rooms} onEdit={reqEdit} onCancel={reqCancel}/>}
          </div>
        )}
      </div>

      {/* Modals */}
      {showForm && <ResForm rooms={rooms} onSubmit={addRes} onClose={()=>{setShowForm(false);setFormPrefill(null);}} loading={busy} prefill={formPrefill}/>}
      {editTarget && <ResForm rooms={rooms} initial={editTarget} onSubmit={updateRes} onClose={()=>setEditTarget(null)} loading={busy}/>}
      {detailRes && <ResDetail res={detailRes} rooms={rooms} onClose={()=>setDetailRes(null)} onEdit={reqEdit} onCancel={reqCancel}/>}
      {cancelTarget && (
        <Modal title="申請を取り消しますか？" onClose={()=>setCancelTarget(null)}>
          <p style={{color:P.muted,fontSize:'13px'}}><strong style={{color:P.text}}>{cancelTarget.name}</strong> さんの <strong style={{color:P.text}}>「{cancelTarget.room}」</strong> の申請を取り消します。この操作は元に戻せません。</p>
          <div style={{display:'flex',gap:'8px',justifyContent:'flex-end',marginTop:'14px'}}>
            <Btn variant="ghost" onClick={()=>setCancelTarget(null)}>やめる</Btn>
            <Btn variant="danger" onClick={cancelRes} disabled={busy}>{busy?'処理中…':'取り消す'}</Btn>
          </div>
        </Modal>
      )}
      {pwTarget && <PwDialog storedHash={pwTarget.passwordHash} onConfirm={pwConfirm} onCancel={()=>{setPwTarget(null);setPwAction(null);}}/>}
      {showSettings && (
        <SettingsModal
          gasUrl={gasUrl} setGasUrl={setGasUrl}
          recipients={mailRecipients} setRecipients={setMailRecipients}
          rooms={rooms} onAddRoom={addRoom} onRemoveRoom={removeRoom}
          reservations={reservations}
          adminPw={adminPw} setAdminPw={setAdminPw}
          loading={busy}
          onClose={()=>setShowSettings(false)}
        />
      )}
      {settingsGate && (
        <AdminGate adminPw={adminPw}
          onConfirm={()=>{setSettingsGate(false);setShowSettings(true);}}
          onCancel={()=>setSettingsGate(false)}/>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
